<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hollow Knight</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #unity-canvas{width:100vw !important;height:100vh !important;position:fixed;top:0;left:0;display:block;background:#000}
  #unity-loading-bar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-family:Arial;z-index:999}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="unity-loading-bar">Loading...</div>
<script>
const BASE = "https://raw.githack.com/karah0916/hollow-knight/main/";
const loaderUrl = BASE + "Build/w-pt.loader.js";
var canvas = document.getElementById('unity-canvas');

var script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => {
  createUnityInstance(canvas, {
    dataUrl: BASE + "Build/w-pt.data.unityweb",
    frameworkUrl: BASE + "Build/w-pt.framework.js.unityweb",
    codeUrl: BASE + "Build/w-pt.wasm.unityweb",
    streamingAssetsUrl: BASE + "StreamingAssets",
    companyName: "TeamCherry",
    productName: "Hollow Knight",
    productVersion: "1.5",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: window.devicePixelRatio,
  }).then(()=>{ document.getElementById('unity-loading-bar').style.display='none'; });
};
document.body.appendChild(script);
</script>
</body>
</html>
