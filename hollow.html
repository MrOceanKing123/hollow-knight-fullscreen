<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #unity-canvas{width:100vw !important;height:100vh !important;position:fixed;top:0;left:0;background:#000}
  #unity-loading-bar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<script>
// point to the real game files on githack
const BASE = "https://raw.githack.com/karah0916/hollow-knight/main/";
const loaderUrl = BASE + "Build/w-pt.loader.js";

// force full screen config
var Module = { canvas: document.getElementById('unity-canvas') };

var script = document.createElement('script');
script.src = loaderUrl;
script.onload = () => {
  createUnityInstance(document.getElementById('unity-canvas'), {
    dataUrl: BASE + "Build/w-pt.data.unityweb",
    frameworkUrl: BASE + "Build/w-pt.framework.js.unityweb",
    codeUrl: BASE + "Build/w-pt.wasm.unityweb",
    streamingAssetsUrl: BASE + "StreamingAssets",
    companyName: "TeamCherry",
    productName: "Hollow Knight",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: 1, // makes it sharp + full
  });
};
document.body.appendChild(script);
</script>
</body>
</html>
